<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trang chu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Logo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
          {% for c in categories %}
        <li class="nav-item">
          <a class="nav-link" href="/?category_id={{c.id}}">{{c.name}}</a>
        </li>
          {% endfor %}
         <li class="nav-item">
          <a class="nav-link" href="/?register">Dang ky</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="/?login">Dang nhap</a>
        </li>
      </ul>
    </div>
      <form class="d-flex" method="get">
        <input class="form-control me-2" type="text" placeholder="Search" name="kw">
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
  </div>
</nav>
<section class="container">
    <div class="row">
        {% if products%}
        {% for p in products %}
        <div class="col-md-3 col-6 p-2">
            <div class="card">
              <img class="card-img-top" src="{{p.image}}" alt="Card image">
              <div class="card-body">
                <h4 class="card-title">{{p.name}}</h4>
                <p class="card-text">Gia {{p.price}}VND</p>
                <a href="#" class="btn btn-primary">Mua hang</a>
              </div>
            </div>
        </div>
        {% endfor %}
        {%else%}
        <h1 class="alert-warning alert">Khong co san pham nao</h1>
        {%endif%}

    </div>
</section>
</body>
</html>
